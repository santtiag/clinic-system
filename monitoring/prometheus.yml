global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'kong'
    static_configs:
      # Kong exposes /metrics on Admin API (8001), not on the proxy port (8000)
      - targets: ['kong:8001']
    metrics_path: /metrics

  - job_name: 'identity-service'
    static_configs:
      - targets: ['identity-service:8000']

  - job_name: 'scheduling-service'
    static_configs:
      - targets: ['scheduling-service:8000']

  - job_name: 'medical-record-service'
    static_configs:
      - targets: ['medical-record-service:8000']

  - job_name: 'billing-service'
    static_configs:
      - targets: ['billing-service:8000']

  - job_name: 'reporting-service'
    static_configs:
      - targets: ['reporting-service:8000']

  - job_name: 'admin-panel'
    static_configs:
      - targets: ['admin-panel:8000']
